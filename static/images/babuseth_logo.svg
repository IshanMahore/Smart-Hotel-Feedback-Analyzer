<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d" />
      <stop offset="100%" stop-color="#162c5b" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hotel Emblem Crest -->
  <g transform="translate(15, 12)">
    <!-- Crest Shield Outline -->
    <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#bgGradient)" stroke="#ea580c" stroke-width="2.5" filter="url(#shadow)"/>
    
    <!-- Stylized Hotel / Gateway Roof & Pillar Arch -->
    <!-- Gable Roof -->
    <path d="M 48 18 L 80 38 L 16 38 Z" fill="url(#orangeGrad)"/>
    
    <!-- 4 Royal Pillars -->
    <rect x="23" y="42" width="6" height="28" rx="1.5" fill="#ffffff"/>
    <rect x="37" y="42" width="6" height="28" rx="1.5" fill="#ffffff"/>
    <rect x="53" y="42" width="6" height="28" rx="1.5" fill="#ffffff"/>
    <rect x="67" y="42" width="6" height="28" rx="1.5" fill="#ffffff"/>
    
    <!-- Base Foundation -->
    <rect x="18" y="72" width="60" height="6" rx="2" fill="url(#orangeGrad)"/>
    
    <!-- Central Star Badge -->
    <circle cx="48" cy="29" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <!-- Main Name: BABUSETH -->
  <text x="124" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0b1b3d" letter-spacing="1">
    BABUSETH
  </text>
  
  <!-- Highlight bar -->
  <rect x="124" y="60" width="140" height="3" rx="1.5" fill="url(#orangeGrad)"/>

  <!-- Subtitle: GUEST HOUSE & LODGING -->
  <text x="124" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ea580c" letter-spacing="2">
    GUEST HOUSE &amp; LODGING
  </text>

  <!-- Tagline: CHHATRAPATI SAMBHAJINAGAR -->
  <text x="124" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.5">
    RAILWAY STATION • CHHATRAPATI SAMBHAJINAGAR
  </text>
</svg>
